name: Manual Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Confirm the package version on main is approved for release
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Create release for new version
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for unreleased version
        id: check
        run: node scripts/check-release-version.mjs

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          NOTES="Released ${TAG}."
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
